[package]
name = "typesong"
version = "0.1.0"
description = "Turns your typing, and your AI agent's work, into music"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde_json = "1"
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[profile.release]
opt-level = "s"
lto = true
strip = true
